name: Despliegue

# SOLO manual: nada se publica por un push. Se elige el entorno en "Run workflow".
# - staging: sube una versión de prueba (alias de rama "staging" de Cloudflare Pages).
# - produccion: exige escribir PUBLICAR y, si se configura, la aprobación de un revisor en el
#   entorno "produccion" de GitHub (Settings > Environments).
# Para revertir: ejecutar este flujo eligiendo en "Use workflow from" una etiqueta o rama anterior.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Dónde publicar'
        type: choice
        options: [staging, produccion]
        default: staging
      confirmacion:
        description: 'Solo para produccion: escribe PUBLICAR'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: despliegue-${{ inputs.entorno }}
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar antes de publicar
    runs-on: ubuntu-latest
    if: inputs.entorno != 'produccion' || inputs.confirmacion == 'PUBLICAR'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  desplegar:
    name: Publicar en Cloudflare Pages (${{ inputs.entorno }})
    needs: verificar
    runs-on: ubuntu-latest
    # Entorno de GitHub con el mismo nombre: ahí viven los secretos y, en produccion, la aprobación.
    environment: ${{ inputs.entorno }}
    env:
      # Nombres, nunca valores: se crean en Settings > Secrets and variables > Actions.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROYECTO: ${{ vars.CLOUDFLARE_PROYECTO }}
      RAMA: ${{ inputs.entorno == 'produccion' && 'main' || 'staging' }}
      DIRECCION: ${{ inputs.entorno == 'produccion' && format('https://{0}.pages.dev', vars.CLOUDFLARE_PROYECTO) || format('https://staging.{0}.pages.dev', vars.CLOUDFLARE_PROYECTO) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir dist/ a Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name="$PROYECTO" --branch="$RAMA" --commit-hash="$GITHUB_SHA"
      - name: Comprobar el sitio publicado (incluye las cabeceras HTTP)
        run: npm run smoke -- "$DIRECCION" --headers
